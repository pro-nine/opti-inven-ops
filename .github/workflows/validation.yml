name: validation

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: .
  MPLBACKEND: Agg

jobs:
  benchmarks-and-docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: Requirements.txt
      - run: python -m pip install -r Requirements.txt pytest
      - run: python -m pip check
      - run: python -m pytest -q
      - run: python -m src.robustness
      - name: Build current Dockerfile
        run: docker build -t opti-inven-validation .
      - name: Execute container pipeline
        run: docker run --rm opti-inven-validation
      - uses: actions/upload-artifact@v4
        with:
          name: model-validation
          path: outputs/validation/
          if-no-files-found: error
          retention-days: 14
