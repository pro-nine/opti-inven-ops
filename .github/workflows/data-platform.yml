name: data-platform

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHONPATH: .

jobs:
  test-and-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r Requirements.txt
      - run: python -m pip install -r requirements-data-platform.txt
      - run: python -c "import scipy; print(f'SciPy {scipy.__version__}')"
      - run: pytest -q
      - run: python -m data_platform.pipeline
