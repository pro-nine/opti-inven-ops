name: data-platform

on:
  push:
    branches: [upgrade/data-platform, main]
  pull_request:
    branches: [main]

env:
  PYTHONPATH: .

jobs:
  test-and-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r Requirements.txt
      - run: pip install -r requirements-data-platform.txt
      - run: pytest -q
      - run: python -m data_platform.pipeline
