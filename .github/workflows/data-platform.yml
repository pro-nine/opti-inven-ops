name: data-platform

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: data-platform-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONPATH: .
  MPLBACKEND: Agg

jobs:
  test-and-run:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: Requirements.txt

      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r Requirements.txt duckdb pytest
      - run: python -c "import scipy; print(f'SciPy {scipy.__version__}')"
      - run: pytest -q
      - run: python -m data_platform.pipeline

      - name: Upload Power BI exports
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: powerbi-exports
          path: data/powerbi/
          if-no-files-found: ignore
